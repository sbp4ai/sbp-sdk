<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SBP · 会话</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#e9ebef;
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif;color:#111827}
  #stage{height:100dvh;display:flex;align-items:center;justify-content:center;gap:28px;padding:0}
  #phone{width:390px;height:min(844px,100dvh);background:#fff;border-radius:30px;overflow:hidden;
    box-shadow:0 24px 64px rgba(15,23,42,.18),0 0 0 1px rgba(15,23,42,.06);position:relative}
  #app{height:100%}
  #hint{width:260px;font-size:12.5px;line-height:1.9;color:#4b5563}
  #hint b{color:#111827;display:block;font-size:13px;margin-bottom:6px}
  #hint code{background:#fff;border:1px solid #dfe3e8;border-radius:5px;padding:1px 5px;font-size:11.5px}
  @media (max-width:900px){#hint{display:none}}
  @media (max-width:430px){#phone{width:100%;height:100dvh;border-radius:0;box-shadow:none}}
  .landing{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:32px;text-align:center;gap:14px}
  .landing h1{font-size:17px;margin:0}
  .landing p{color:#6b7280;font-size:12.5px;margin:0;line-height:1.8}
  .landing a{display:inline-block;background:#2563eb;color:#fff;text-decoration:none;border-radius:10px;
    padding:9px 18px;font-size:13px;font-weight:600}
  .landing .code{font:13px/1 ui-monospace,Menlo,monospace;background:#f3f4f6;border-radius:8px;
    padding:10px 14px;letter-spacing:2px}
</style>
</head>
<body>
<div id="stage">
  <div id="phone"><div id="app"></div></div>
  <aside id="hint">
    <b>SBP v0.1 参考实现</b>
    这是「IM 内置浏览器里那个网页」。桌面端只是套了个手机壳。<br><br>
    ① 电脑：<code>sbp-bridge up --auto-bind</code><br>
    ② 用打印出来的链接打开本页<br>
    ③ 列表只有标题，点进去才拉历史（倒序 20 条/页）<br><br>
    在飞书 / 钉钉里，这个 URL 会由机器人卡片直接打开，token 走 URL fragment。
  </aside>
</div>
<script src="/sbp-sdk.js"></script>
<script>
(function () {
  var hasToken = /(^|&)t=/.test(location.hash.replace(/^#/, ""));
  if (!hasToken) {
    document.getElementById("app").innerHTML =
      '<div class="landing">' +
      '  <h1>还没有绑定设备</h1>' +
      '  <p>在电脑上执行 <code>sbp-bridge up</code><br>拿到 8 位验证码后在这里输入。</p>' +
      '  <a href="/bind">输入验证码</a>' +
      '</div>';
    return;
  }
  SBP.mount("#app", {});
})();
</script>
</body>
</html>
